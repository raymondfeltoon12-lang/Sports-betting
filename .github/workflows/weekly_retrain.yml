name: Weekly retrain

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (data, features, models, backtest, picks)
        run: python main.py --with-live-odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated eval/backtest/picks summaries if changed
        run: |
          git config user.name "weekly-retrain-bot"
          git config user.email "actions@github.com"
          git add models/artifacts/model_eval_summary.csv backtest/results/backtest_summary.csv data/processed/upcoming_picks.csv data/processed/prop_hit_rates.csv
          git diff --staged --quiet || git commit -m "chore: weekly retrain $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
